name: Offline checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install pinned development tools
        run: python -m pip install -r requirements-dev.txt -c requirements-lock.txt
      - name: Lint and type checks
        run: python tasks.py lint
      - name: Offline unit and compiler tests
        run: python tasks.py test
      - name: Validate schemas and fixtures
        run: python tasks.py schemas
      - name: Check documentation references
        run: python tasks.py docs-check
