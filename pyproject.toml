[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
markers = ["integration: requires explicit permission to contact a real LLM endpoint"]
